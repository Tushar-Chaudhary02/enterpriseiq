[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriseiq"
version = "0.4.0"
description = "An agentic AI customer intelligence and retention platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "joblib",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "xgboost.*",
]
ignore_missing_imports = true